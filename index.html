<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Styvik Journal | Reading Article</title>
  
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4YSE1ZD8P2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4YSE1ZD8P2');
  </script>

  <style>
    :root {
      --primary: #2563eb;      
      --accent: #f97316;       
      --bg: #faf9f5;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #475569;
      --border-dark: #000000;
      --border-width: 1px; 
      --radius-sm: 12px;
      --radius: 20px;
      --radius-full: 99px;
      --font-main: 'Inter', sans-serif;
      --font-serif: 'Playfair Display', serif;
      --transition-smooth: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: 0.15s ease-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;}
    html, body { max-width: 100vw; overflow-x: hidden; scroll-behavior: smooth; }
    
    body { font-family: var(--font-main); background-color: var(--bg); color: var(--text); line-height: 1.7; padding-top: 90px; padding-bottom: 60px; }
    
    .container { max-width: 860px; margin: 0 auto; padding: 0 20px; width: 100%; box-sizing: border-box; }
    a { text-decoration: none; color: inherit; }

    /* HEADER */
    .top-header { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: var(--border-width) solid var(--border-dark); z-index: 1001; display: flex; align-items: center; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100%; max-width: 1240px; margin: 0 auto; padding: 0 20px; gap: 16px; }
    
    /* BACK BUTTON */
    .back-btn { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); padding: 8px 16px; border-radius: var(--radius-full); border: var(--border-width) solid var(--border-dark); background: var(--surface); transition: var(--transition-fast); cursor: pointer; text-decoration: none; }
    .back-btn:hover { background: var(--bg); transform: translateX(-3px); }
    .back-btn svg { width: 18px; height: 18px; stroke-width: 2.2; }

    .site-logo { height: 20px; width: auto; display: block; }
    
    .search-bar-desktop { flex: 1; max-width: 420px; display: flex; align-items: center; justify-content: flex-end;}
    .search-input-wrapper { position: relative; width: 100%; }
    .search-bar-input { width: 100%; padding: 8px 16px 8px 38px; border: var(--border-width) solid var(--border-dark); border-radius: var(--radius-full); font-family: var(--font-main); font-size: 0.9rem; font-weight: 500; background: var(--bg); outline: none; }
    .search-bar-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--text); stroke-width: 2; pointer-events: none;}
    
    /* ARTICLE CONTENT */
    .article-hero-img { width: 100%; max-height: 480px; object-fit: cover; border-radius: 20px; border: var(--border-width) solid var(--border-dark); margin: 20px 0 32px 0; background: #e2e8f0; }
    .article-meta-badge { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .article-category { background: var(--surface); padding: 4px 12px; border-radius: 99px; border: var(--border-width) solid var(--border-dark); color: var(--primary); }
    .article-date { color: var(--text-secondary); }

    .article-title { font-family: var(--font-serif); font-size: 3rem; font-weight: 700; line-height: 1.2; margin-bottom: 24px; color: var(--text); letter-spacing: -0.02em; }
    
    .author-card { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-top: var(--border-width) solid #e2e8f0; border-bottom: var(--border-width) solid #e2e8f0; margin-bottom: 40px; }
    .author-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--text); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; }
    .author-info h4 { font-size: 0.95rem; font-weight: 700; margin: 0; }
    .author-info p { font-size: 0.8rem; color: var(--text-secondary); margin: 0; }

    .article-body { font-size: 1.15rem; line-height: 1.85; color: #1e293b; }
    .article-body p { margin-bottom: 24px; }
    .article-body h2, .article-body h3 { font-family: var(--font-serif); margin: 36px 0 16px 0; color: var(--text); }
    .article-body img { width: 100%; border-radius: 12px; margin: 24px 0; border: var(--border-width) solid var(--border-dark); }

    /* SKELETON */
    .skeleton-box { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: fastShimmer 1.5s infinite linear; border-radius: 8px; }
    @keyframes fastShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media(max-width: 768px) {
      .article-title { font-size: 2.2rem; }
      .search-bar-desktop { display: none; }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="header-inner">
      <!-- FIXED BACK NAVIGATION -->
      <a href="javascript:void(0)" onclick="goBackOrHome()" class="back-btn" aria-label="Go Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <img src="images/logo.png" alt="Styvik" class="site-logo">
      </a>
      
      <div class="search-bar-desktop">
        <div class="search-input-wrapper">
          <svg class="search-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search-bar-input" placeholder="Search brands, styles, pieces..." autocomplete="off">
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="articleContainer">
      <!-- Loading Skeleton -->
      <div class="skeleton-box" style="width: 100%; height: 380px; margin-top: 20px; border-radius: 20px;"></div>
      <div class="skeleton-box" style="width: 140px; height: 26px; margin: 24px 0 16px 0; border-radius: 99px;"></div>
      <div class="skeleton-box" style="width: 90%; height: 48px; margin-bottom: 24px;"></div>
      <div class="skeleton-box" style="width: 100%; height: 160px;"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <script>
    // SMART BACK BUTTON: Goes back in history if available, else falls back to index.html
    function goBackOrHome() {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCBGOFSfFbk8oVC7LMLql7VkkwrfVXjJQ4",
      authDomain: "styvik-4.firebaseapp.com",
      projectId: "styvik-4",
      storageBucket: "styvik-4.firebasestorage.app",
      messagingSenderId: "877615452108",
      appId: "1:877615452108:web:cab75a7f24ac5b559a1769",
      measurementId: "G-SG98PY367W"
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const docId = params.get('id');
      const container = document.getElementById('articleContainer');

      if (!docId) {
        container.innerHTML = `<h2 style="text-align:center; margin-top:60px;">Article not found.</h2>`;
        return;
      }

      try {
        const doc = await db.collection('blogs').doc(docId).get();
        if (!doc.exists) {
          container.innerHTML = `<h2 style="text-align:center; margin-top:60px;">Article does not exist.</h2>`;
          return;
        }

        const data = doc.data();
        let dateStr = 'Recently';
        if (data.createdAt && typeof data.createdAt.toMillis === 'function') {
          dateStr = new Date(data.createdAt.toMillis()).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        const imgUrl = (data.images && data.images.length > 0) ? data.images[0] : (data.coverImage || '');

        container.innerHTML = `
          ${imgUrl ? `<img src="${imgUrl}" alt="${data.title || ''}" class="article-hero-img">` : ''}
          <div class="article-meta-badge">
            <span class="article-category">${data.category || 'Editorial'}</span>
            <span class="article-date">${dateStr}</span>
          </div>
          <h1 class="article-title">${data.title || 'Untitled Article'}</h1>
          
          <div class="author-card">
            <div class="author-avatar">${(data.author || 'S').charAt(0).toUpperCase()}</div>
            <div class="author-info">
              <h4>${data.author || 'Styvik Admin'}</h4>
              <p>Fashion Editor</p>
            </div>
          </div>

          <div class="article-body">
            ${data.content || data.body || (data.description ? `<p>${data.description}</p>` : '<p>No content available.</p>')}
          </div>
        `;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<h2 style="text-align:center; margin-top:60px;">Failed to load article.</h2>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPost);
  </script>
</body>
</html>
